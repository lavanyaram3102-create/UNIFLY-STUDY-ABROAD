<?xml version="1.0" encoding="UTF-8"?>
<!-- Header wordmark + emblem SVG (suitable for site header) -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-labelledby="title">
  <title id="title">UNIFLY Study Abroad</title>
  <defs>
    <linearGradient id="navy" x1="0" x2="1">
      <stop offset="0%" stop-color="#0B2A4D" />
      <stop offset="100%" stop-color="#0B2A4D" />
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#B67A2A" />
      <stop offset="100%" stop-color="#B67A2A" />
    </linearGradient>
  </defs>

  <g transform="translate(12,6)">
    <!-- emblem: abstract U with book + globe + swoosh -->
    <g id="emblem" transform="scale(0.9)">
      <path d="M18 70 C26 50, 40 44, 48 50 C56 44, 70 50, 78 70 L78 78 L18 78 Z" fill="#0B2A4D" opacity="0.95" />
      <path d="M36 18 Q48 6, 60 18 L56 22 Q48 14, 40 22 Z" fill="#B67A2A"/>
      <path d="M84 12 C110 20, 120 44, 140 46" stroke="#B67A2A" stroke-width="6" fill="none" stroke-linecap="round"/>
      <polygon points="142,44 150,40 146,48" fill="#B67A2A" />
      <circle cx="52" cy="46" r="18" fill="#FFFFFF"/>
      <path d="M42 44 C46 36, 58 36, 62 44" stroke="#0B2A4D" stroke-width="1.2" fill="none"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(120,36)">
    <text x="0" y="26" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="36" fill="#0B2A4D">UNI<tspan fill="#B67A2A">FLY</tspan></text>
    <text x="0" y="52" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12" fill="#6B7280">STUDY ABROAD</text>
  </g>
</svg>
